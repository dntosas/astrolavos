version: 2
# before:
  # hooks:
    # - go mod download
dist: bin
project_name: astrolavos
env:
  - DOCKER_REPO="ghcr.io/dntosas"
builds:
  - env:
      - CGO_ENABLED=0
    binary: "{{ .ProjectName }}"
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
      - -mod=vendor
    ldflags:
      - -s -w
      - -X main.Version={{ .Version }}
      - -X main.CommitHash={{ .FullCommit }}
    main: .

dockers:
  # amd64
  - image_templates:
      - ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}-amd64
      - ghcr.io/dntosas/{{ .ProjectName }}:v{{ .Version }}-amd64
      - ghcr.io/dntosas/{{ .ProjectName }}:latest-amd64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: amd64
    build_flag_templates:
    - "--pull"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.title={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--platform=linux/amd64"
  # arm64
  - image_templates:
      - ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}-arm64
      - ghcr.io/dntosas/{{ .ProjectName }}:v{{ .Version }}-arm64
      - ghcr.io/dntosas/{{ .ProjectName }}:latest-arm64
    dockerfile: Dockerfile
    use: buildx
    goos: linux
    goarch: arm64
    build_flag_templates:
    - "--pull"
    - "--label=org.opencontainers.image.created={{.Date}}"
    - "--label=org.opencontainers.image.title={{.ProjectName}}"
    - "--label=org.opencontainers.image.revision={{.FullCommit}}"
    - "--label=org.opencontainers.image.version={{.Version}}"
    - "--platform=linux/arm64/v8"

docker_manifests:
  # https://goreleaser.com/customization/docker_manifest/
  - name_template: ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}
    image_templates:
      - ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}-amd64
      - ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}-arm64
  - name_template: ghcr.io/dntosas/{{ .ProjectName }}:v{{ .Version }}
    image_templates:
      - ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}-amd64
      - ghcr.io/dntosas/{{ .ProjectName }}:{{ .Version }}-arm64
  - name_template: ghcr.io/dntosas/{{ .ProjectName }}:latest
    image_templates:
      - ghcr.io/dntosas/{{ .ProjectName }}:latest-amd64
      - ghcr.io/dntosas/{{ .ProjectName }}:latest-arm64

archives:
  - formats: [tar.gz]
    # this name template makes the OS and Arch compatible with the results of uname.
    name_template: >-
      {{ .ProjectName }}_
      {{- title .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else }}{{ .Arch }}{{ end }}
      {{- if .Arm }}v{{ .Arm }}{{ end }}
    # use zip for windows archives
    format_overrides:
    - goos: windows
      formats: [zip]
checksum:
  name_template: 'checksums.txt'

# SPDX SBOM per release archive, generated with syft (installed in the
# release workflow) and uploaded alongside the archives.
sboms:
  - artifacts: archive

# Keyless (Sigstore) signatures. The release workflow runs with
# `id-token: write`, so cosign obtains a short-lived certificate bound to the
# workflow identity; no long-lived signing key exists anywhere.
#
# cosign >= 3 writes blob signatures as a single Sigstore bundle (signature,
# certificate and transparency-log entry in one JSON file) and requires
# `--bundle`; the old `--output-signature`/`--output-certificate` pair is
# ignored. The bundle is uploaded as `checksums.txt.sigstore.json`.
#
# Verify a release checksum file with:
#   cosign verify-blob --bundle checksums.txt.sigstore.json \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/dntosas/astrolavos/\.github/workflows/go-release\.yml@refs/tags/v' \
#     checksums.txt
signs:
  - cmd: cosign
    artifacts: checksum
    signature: '${artifact}.sigstore.json'
    output: true
    args:
      - sign-blob
      - '--bundle=${signature}'
      - '${artifact}'
      - --yes

# Sign every pushed image and multi-arch manifest by digest.
#
# `--new-bundle-format=false` keeps the signature in the legacy layout cosign
# has used since 1.x: a `sha256-<digest>.sig` tag next to the image. cosign 3
# defaults to storing it as an OCI 1.1 referring artifact instead, which
# cosign 2.x clients and older Kyverno releases cannot verify. Flip this once
# every consumer runs cosign 3 / Kyverno with Sigstore bundle support.
#
# Verify an image with:
#   cosign verify ghcr.io/dntosas/astrolavos:vX.Y.Z \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com \
#     --certificate-identity-regexp '^https://github.com/dntosas/astrolavos/\.github/workflows/go-release\.yml@refs/tags/v'
docker_signs:
  - cmd: cosign
    artifacts: all
    output: true
    args:
      - sign
      - --new-bundle-format=false
      - '${artifact}@${digest}'
      - --yes

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT"
changelog:
  sort: asc
  abbrev: 7
  filters:
    exclude:
      - '^Merge\spull\srequest\s'
  # Group by Conventional Commits type so release notes read as a changelog.
  groups:
    - title: Breaking changes
      regexp: '^.*?[a-z]+(\([[:word:]]+\))?!:.+$'
      order: 0
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))?:.+$'
      order: 1
    - title: Bug fixes
      regexp: '^.*?fix(\([[:word:]]+\))?:.+$'
      order: 2
    - title: Performance
      regexp: '^.*?perf(\([[:word:]]+\))?:.+$'
      order: 3
    - title: Dependencies
      regexp: '^.*?chore\(deps\):.+$'
      order: 4
    - title: Other changes
      order: 999

