---
name: "CI"
on:
  push:
      branches: [main]
      paths:
      - '.github/workflows/*'
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
  pull_request:
      paths:
      - '.github/workflows/*'
      - '*.go'
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  build:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run go fmt
        run: make fmt

      - name: Run go vet
        run: make vet

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.14.0
          args: --timeout 5m --modules-download-mode=vendor

      - name: Run go test
        run: make test

      - name: Run govulncheck
        run: make vulncheck
