name: E2E Tests
on:
  workflow_dispatch:
    inputs:
      version:
        description: Name of the version to test
        type: string
        required: true
  workflow_call:
    inputs:
      version:
        description: Name of the version to test
        type: string
        required: true

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Create k8s Kind Cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Run E2E tests
        run: make e2e ASTROLAVOS_VERSION=${{ inputs.version }}
