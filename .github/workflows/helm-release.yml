name: Helm Release
# Dispatch-only. release.yml runs this after go-release.yml has published
# the image the bumped chart references. It used to run on every push to
# main, but main carries a bumped-but-unreleased chart between the release
# commit and a successful image build, and any unrelated push in that window
# would publish a chart pointing at an image that does not exist yet.
# Manual fallback: gh workflow run helm-release.yml --ref main
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Helm Chart
    runs-on: ubuntu-latest
    permissions:
      contents: write  # chart-releaser pushes to gh-pages and creates releases
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5
        with:
          version: v3.22.0

      - name: Add Helm dependency repos
        run: |
          helm repo add bitnami https://charts.bitnami.com/bitnami
          helm repo update

      - name: Run chart-releaser
        uses: helm/chart-releaser-action@cae68fefc6b5f367a0275617c9f83181ba54714f # v1.7.0
        with:
          charts_dir: "deploy"
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
