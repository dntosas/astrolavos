---
name: "Release"
on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  # release.yml dispatches this at the tag it just pushed (GITHUB_TOKEN pushes
  # do not fire `on: push`). Run it from the Actions UI with a vX.Y.Z tag
  # selected as the ref to re-publish an existing tag.
  workflow_dispatch:

# Default for every job; the release job widens this explicitly below.
permissions:
  contents: read

jobs:
  build:
    name: Create Release
    # GoReleaser needs HEAD to be the tagged commit; refuse a dispatch on a branch
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the GitHub release and upload assets
      packages: write      # push images and signatures to GHCR
      id-token: write      # keyless cosign: OIDC token -> Fulcio certificate
      attestations: write  # actions/attest-build-provenance
    steps:
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27'

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: false

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          args: release --clean --config .github/config/goreleaser.yaml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # SLSA build provenance for the release archives, SBOMs and checksums.
      # Verify with: gh attestation verify <file> --owner dntosas
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            bin/*.tar.gz
            bin/*.sbom.json
            bin/checksums.txt

      # GoReleaser records every pushed image and manifest digest in
      # artifacts.json. Attest the multi-arch manifest the Helm chart pulls
      # (`:vX.Y.Z`); the `:X.Y.Z` and `:latest` manifests reference the same
      # per-arch images and therefore share this digest.
      - name: Resolve image manifest digest
        id: digest
        run: |
          set -euo pipefail
          digest=$(jq -er --arg ref "ghcr.io/dntosas/astrolavos:${GITHUB_REF_NAME}" \
            '.[] | select(.type == "Docker Manifest" and .name == $ref) | .extra.Digest' bin/artifacts.json)
          echo "Manifest ${GITHUB_REF_NAME} -> ${digest}"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      # Verify with: gh attestation verify oci://ghcr.io/dntosas/astrolavos:vX.Y.Z --owner dntosas
      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ghcr.io/dntosas/astrolavos
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true

  post:
    name: Run E2E Tests
    needs:
      - build
    permissions:
      contents: read
    uses: ./.github/workflows/e2e.yml
    with:
      version: ${{ github.ref_name }}
