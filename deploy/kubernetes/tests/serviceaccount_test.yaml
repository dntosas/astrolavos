suite: ServiceAccount
templates:
  - templates/serviceaccount.yaml
release:
  name: astrolavos
  namespace: monitoring
tests:
  - it: creates a ServiceAccount that does not auto-mount its token
    asserts:
      - isKind:
          of: ServiceAccount
      - equal:
          path: metadata.name
          value: astrolavos
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: automountServiceAccountToken
          value: false
      - notExists:
          path: metadata.annotations

  - it: can opt back into token auto-mount
    set:
      serviceAccount:
        automountServiceAccountToken: true
    asserts:
      - equal:
          path: automountServiceAccountToken
          value: true

  - it: uses the given name and merges annotations, rendered as templates
    set:
      serviceAccount:
        name: probe-sa
        annotations:
          eks.amazonaws.com/role-arn: "arn:aws:iam::123456789012:role/{{ .Release.Name }}"
      commonAnnotations:
        owner: sre
    asserts:
      - equal:
          path: metadata.name
          value: probe-sa
      - equal:
          path: metadata.annotations
          value:
            owner: sre
            eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/astrolavos

  - it: is not rendered when create is false
    set:
      serviceAccount:
        create: false
    asserts:
      - hasDocuments:
          count: 0
