suite: ServiceMonitor
templates:
  - templates/servicemonitor.yaml
release:
  name: astrolavos
  namespace: monitoring
tests:
  - it: scrapes the Service http port in the release namespace
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    asserts:
      - isKind:
          of: ServiceMonitor
      - isAPIVersion:
          of: monitoring.coreos.com/v1
      - equal:
          path: metadata.name
          value: astrolavos
      - equal:
          path: metadata.namespace
          value: monitoring
      - equal:
          path: spec.endpoints
          value:
            - port: http
              interval: 30s
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [monitoring]
      # must match the Service selector so the scrape finds the endpoints
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: astrolavos
            app.kubernetes.io/instance: astrolavos
      - notExists:
          path: spec.podTargetLabels

  - it: can live in the Prometheus namespace while still selecting the release namespace
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      serviceMonitor:
        namespace: prometheus
        additionalLabels:
          release: kube-prometheus-stack
    asserts:
      - equal:
          path: metadata.namespace
          value: prometheus
      - equal:
          path: metadata.labels.release
          value: kube-prometheus-stack
      - equal:
          path: spec.namespaceSelector.matchNames
          value: [monitoring]

  - it: renders the scrape tuning knobs
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      serviceMonitor:
        interval: 15s
        scrapeTimeout: 10s
        honorLabels: true
        podTargetLabels: [node]
        relabellings:
          - sourceLabels: [__meta_kubernetes_pod_node_name]
            targetLabel: node
        metricRelabelings:
          - sourceLabels: [__name__]
            regex: go_.*
            action: drop
    asserts:
      - equal:
          path: spec.endpoints[0].interval
          value: 15s
      - equal:
          path: spec.endpoints[0].scrapeTimeout
          value: 10s
      - equal:
          path: spec.endpoints[0].honorLabels
          value: true
      - equal:
          path: spec.endpoints[0].relabelings[0].targetLabel
          value: node
      - equal:
          path: spec.endpoints[0].metricRelabelings[0].action
          value: drop
      - equal:
          path: spec.podTargetLabels
          value: [node]

  - it: is skipped when the Prometheus Operator CRDs are absent
    asserts:
      - hasDocuments:
          count: 0

  - it: is not rendered when disabled
    capabilities:
      apiVersions:
        - monitoring.coreos.com/v1
    set:
      serviceMonitor:
        enabled: false
    asserts:
      - hasDocuments:
          count: 0
