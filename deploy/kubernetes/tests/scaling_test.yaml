suite: PodDisruptionBudget and HorizontalPodAutoscaler
templates:
  - templates/pdb.yaml
  - templates/hpa.yaml
release:
  name: astrolavos
  namespace: monitoring
capabilities:
  majorVersion: 1
  minorVersion: 31
tests:
  # DaemonSet pods are not subject to eviction-based drains and cannot be
  # autoscaled, so neither object has a target by default.
  - it: renders neither object for the default DaemonSet
    asserts:
      - hasDocuments:
          count: 0

  - it: protects a Deployment with a minAvailable budget
    set:
      deployAsDaemonSet: false
    template: templates/pdb.yaml
    asserts:
      - isKind:
          of: PodDisruptionBudget
      - isAPIVersion:
          of: policy/v1
      - equal:
          path: metadata.name
          value: astrolavos
      - equal:
          path: spec.minAvailable
          value: 50%
      - notExists:
          path: spec.maxUnavailable
      - equal:
          path: spec.selector.matchLabels
          value:
            app.kubernetes.io/name: astrolavos
            app.kubernetes.io/instance: astrolavos

  - it: switches the budget to maxUnavailable when minAvailable is zeroed
    set:
      deployAsDaemonSet: false
      pdb:
        minAvailable: 0
        maxUnavailable: 1
    template: templates/pdb.yaml
    asserts:
      - notExists:
          path: spec.minAvailable
      - equal:
          path: spec.maxUnavailable
          value: 1

  - it: skips the budget when pdb.create is false
    set:
      deployAsDaemonSet: false
      pdb:
        create: false
    template: templates/pdb.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: scales the Deployment on CPU and memory utilisation
    set:
      deployAsDaemonSet: false
    template: templates/hpa.yaml
    asserts:
      - isKind:
          of: HorizontalPodAutoscaler
      - isAPIVersion:
          of: autoscaling/v2
      - equal:
          path: spec.scaleTargetRef
          value:
            apiVersion: apps/v1
            kind: Deployment
            name: astrolavos
      - equal:
          path: spec.minReplicas
          value: 2
      - equal:
          path: spec.maxReplicas
          value: 5
      - lengthEqual:
          path: spec.metrics
          count: 2
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: cpu
              target:
                type: Utilization
                averageUtilization: 80
      - contains:
          path: spec.metrics
          content:
            type: Resource
            resource:
              name: memory
              target:
                type: Utilization
                averageUtilization: 80

  - it: scales on a single metric when the other target is unset
    set:
      deployAsDaemonSet: false
      autoscaling:
        targetMemory: null
        targetCPU: 70
    template: templates/hpa.yaml
    asserts:
      - lengthEqual:
          path: spec.metrics
          count: 1
      - equal:
          path: spec.metrics[0].resource.name
          value: cpu
      - equal:
          path: spec.metrics[0].resource.target.averageUtilization
          value: 70

  - it: skips the HPA when autoscaling is disabled
    set:
      deployAsDaemonSet: false
      autoscaling:
        enabled: false
    template: templates/hpa.yaml
    asserts:
      - hasDocuments:
          count: 0
