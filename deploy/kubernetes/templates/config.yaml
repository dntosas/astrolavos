{{- if .Values.config.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ printf "%s-config" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    {{- if .Values.commonLabels }}
    {{- include "common.tplvalues.render" ( dict "value" .Values.commonLabels "context" $ ) | nindent 4 }}
    {{- end }}
  {{- if .Values.commonAnnotations }}
  annotations: {{- include "common.tplvalues.render" ( dict "value" .Values.commonAnnotations "context" $ ) | nindent 4 }}
  {{- end }}
data:
  config.yaml: |-
    {{- /* dig tolerates a missing config.metrics block; an empty list renders nothing so the binary default applies */}}
    {{- with dig "metrics" "histogramBuckets" (list) .Values.config }}
    metrics:
      histogramBuckets: {{ toJson . }}
    {{- end }}
    endpoints:
    {{- if .Values.config.endpoints }}
      {{- include "common.tplvalues.render" ( dict "value" .Values.config.endpoints "context" $ ) | nindent 6 }}
    {{- end }}
{{- end }}