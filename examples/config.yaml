---
# Astrolavos Configuration
# This file defines the endpoints to monitor and their probe configurations

# Optional Prometheus metrics tuning.
metrics:
  # Upper bounds (seconds) of the buckets shared by every
  # astrolavos_*_latency_seconds histogram. Must be strictly increasing.
  # Fewer buckets = fewer time series per endpoint. Omit or set to [] to use
  # the built-in default shown here. The ASTROLAVOS_HISTOGRAM_BUCKETS env var
  # (comma-separated, e.g. "0.01,0.1,1") takes precedence over this file.
  histogramBuckets: [0.001, 0.005, 0.01, 0.025, 0.05, 0.1, 0.25, 0.5, 1, 2.5, 5]

endpoints:
  # HTTP trace probe example - measures detailed HTTP request timing
  # Default: retries: 1 (single attempt, no retries)
  # For cluster scaling resilience, increase retries to 5+
  - domain: "www.httpbin.org"
    interval: 5s
    https: true
    retries: 1
    prober: httpTrace
    tag: "public-api"
    reuseConnection: true

  # Self-signed certificate example with TLS verification disabled
  - domain: "self-signed.badssl.com"
    interval: 10s
    tag: "internal-self-signed"
    retries: 1
    skipTLSVerification: true
    https: true
    prober: httpTrace

  # TCP connection probe example
  - domain: "google.com:443"
    interval: 15s
    tag: "tcp-check"
    retries: 1
    prober: tcp

  # Internal service example - with higher retries for demonstration
  - domain: "localhost:8080"
    interval: 5s
    https: false
    retries: 5  # Example: Higher retries for critical endpoints
    prober: httpTrace
    tag: "internal-service"
    reuseConnection: false